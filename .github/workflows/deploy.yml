name: Deploy CBSR site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # This checkout is a verification input only. The builder copies an explicit
      # public-file allowlist, and only the verified _site directory is uploaded.
      - name: Check out the pinned Register contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yunjiefanresearch-hub/cross-border-stablecoin-register
          ref: 270a002e8d66bb9971b3638dfcab52f3b2f6d2fd
          path: .contract/register
          persist-credentials: false

      - name: Use Node.js for the dependency-free contract check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Check snapshot, live fallback, and public-policy contracts
        run: |
          set -euo pipefail
          node --check assets/cbsr.js
          node --check assets/cbsr-live.js
          node --check assets/cbsr-field.js
          node tools/check-register-contract.mjs .contract/register
          CBSR_TEST_REGISTER=.contract/register node --test tools/live-contract.test.mjs
          node --test tools/policy-materials.test.mjs

      - name: Build static bilingual search pages
        env:
          CBSR_PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          python3 tools/build_search_site.py --base-url "$CBSR_PAGES_BASE" --output _site

      - name: Verify the actual public artifact before upload
        env:
          CBSR_PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          python3 tools/search_site_test.py --site-dir _site --base-url "$CBSR_PAGES_BASE"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
